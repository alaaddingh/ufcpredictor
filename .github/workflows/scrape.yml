name: UFC scrape workflow

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 1440

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies for Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-driver

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run notebook
        env:
          CHROME_BIN: /usr/bin/chromium-browser
        run: |
          python -m ipykernel install --user --name ufcpred --display-name "Python (ufcpred)"
          python -m jupyter nbconvert --to notebook --execute process.ipynb --output process.executed.ipynb --ExecutePreprocessor.kernel_name=ufcpred

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-output
          path: |
            data/processed
            process.executed.ipynb
